<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="680px" height="270px" viewBox="0 0 680 270" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow503" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="270" fill="#ffffff"/>

  <!-- title -->
  <text x="340" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3864">循环数组：膨胀为 2n 长度后，等价于线性数组的「下一个更大元素」</text>

  <!-- segment labels -->
  <text x="238" y="52" text-anchor="middle" font-size="12" fill="#6c8ebf">原始（下标 0 ~ n-1）</text>
  <text x="442" y="52" text-anchor="middle" font-size="12" fill="#d6b656">复制一份（模拟循环绕回）</text>

  <!-- divider between original and copy -->
  <line x1="336" y1="42" x2="336" y2="216" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- ===== doubled array : [1,2,1,1,2,1] ===== -->
  <!-- index0 =1 -->
  <rect x="142" y="70" width="56" height="50" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="170" y="95" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#1f3864">1</text>
  <!-- index1 =2 -->
  <rect x="210" y="70" width="56" height="50" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="238" y="95" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#1f3864">2</text>
  <!-- index2 =1 -->
  <rect x="278" y="70" width="56" height="50" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="306" y="95" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#1f3864">1</text>
  <!-- index3 =1 (copy) -->
  <rect x="346" y="70" width="56" height="50" rx="4" fill="#fff2cc" stroke="#d6b656"/>
  <text x="374" y="95" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#7f6000">1</text>
  <!-- index4 =2 (copy) -->
  <rect x="414" y="70" width="56" height="50" rx="4" fill="#fff2cc" stroke="#d6b656"/>
  <text x="442" y="95" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#7f6000">2</text>
  <!-- index5 =1 (copy) -->
  <rect x="482" y="70" width="56" height="50" rx="4" fill="#fff2cc" stroke="#d6b656"/>
  <text x="510" y="95" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#7f6000">1</text>

  <!-- index labels -->
  <text x="170" y="138" text-anchor="middle" font-size="11" fill="#888888">0</text>
  <text x="238" y="138" text-anchor="middle" font-size="11" fill="#888888">1</text>
  <text x="306" y="138" text-anchor="middle" font-size="11" fill="#888888">2</text>
  <text x="374" y="138" text-anchor="middle" font-size="11" fill="#888888">3</text>
  <text x="442" y="138" text-anchor="middle" font-size="11" fill="#888888">4</text>
  <text x="510" y="138" text-anchor="middle" font-size="11" fill="#888888">5</text>

  <!-- ===== result (first n) ===== -->
  <text x="92" y="190" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2e6b2e">ans[0..n-1]:</text>
  <rect x="142" y="170" width="56" height="40" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="170" y="190" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#2e6b2e">2</text>
  <rect x="210" y="170" width="56" height="40" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="238" y="190" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#2e6b2e">-1</text>
  <rect x="278" y="170" width="56" height="40" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="306" y="190" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#2e6b2e">2</text>

  <!-- arrows: from each result up to the greater element it found -->
  <line x1="178" y1="170" x2="234" y2="124" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrow503)"/>
  <path d="M 306 170 Q 374 104 438 124" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrow503)"/>
  <text x="374" y="98" text-anchor="middle" font-size="11" fill="#b85450">循环绕回</text>

  <!-- footer note -->
  <text x="340" y="248" text-anchor="middle" font-size="12" fill="#555555">ans[2]=2 来自下标 4 的那个 2，本质是原数组下标 1 循环绕回来的——这就是「膨胀一倍」的作用。</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="760px" height="380px" viewBox="0 0 760 380" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>

  <!-- title -->
  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3864">单调栈执行过程：nums2 = [1, 3, 4, 2]（逆序遍历，从右往左）</text>

  <!-- ============ Column 1 : i=3 v=2 ============ -->
  <text x="95"  y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3864">第 1 步</text>
  <text x="95"  y="84" text-anchor="middle" font-size="13" fill="#555555">i=3, v=2</text>
  <rect x="67"  y="218" width="56" height="32" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="95"  y="234" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#1f3864">2</text>
  <text x="129" y="234" text-anchor="start" dominant-baseline="central" font-size="11" fill="#b85450">←栈顶</text>
  <rect x="37"  y="270" width="116" height="32" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="95"  y="286" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2e6b2e">map[2] = -1</text>
  <text x="95"  y="324" text-anchor="middle" font-size="11" fill="#888888">栈为空 → -1</text>
  <text x="95"  y="340" text-anchor="middle" font-size="11" fill="#888888">压入 2</text>

  <!-- ============ Column 2 : i=2 v=4 ============ -->
  <text x="285" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3864">第 2 步</text>
  <text x="285" y="84" text-anchor="middle" font-size="13" fill="#555555">i=2, v=4</text>
  <rect x="257" y="218" width="56" height="32" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="285" y="234" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#1f3864">4</text>
  <text x="319" y="234" text-anchor="start" dominant-baseline="central" font-size="11" fill="#b85450">←栈顶</text>
  <rect x="227" y="270" width="116" height="32" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="285" y="286" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2e6b2e">map[4] = -1</text>
  <text x="285" y="324" text-anchor="middle" font-size="11" fill="#888888">弹出 2 后栈空 → -1</text>
  <text x="285" y="340" text-anchor="middle" font-size="11" fill="#888888">压入 4</text>

  <!-- ============ Column 3 : i=1 v=3 ============ -->
  <text x="475" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3864">第 3 步</text>
  <text x="475" y="84" text-anchor="middle" font-size="13" fill="#555555">i=1, v=3</text>
  <rect x="447" y="218" width="56" height="32" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="475" y="234" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#1f3864">4</text>
  <rect x="447" y="182" width="56" height="32" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="475" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#1f3864">3</text>
  <text x="509" y="198" text-anchor="start" dominant-baseline="central" font-size="11" fill="#b85450">←栈顶</text>
  <rect x="417" y="270" width="116" height="32" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="475" y="286" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2e6b2e">map[3] = 4</text>
  <text x="475" y="324" text-anchor="middle" font-size="11" fill="#888888">栈顶 4 &gt; 3 → 4</text>
  <text x="475" y="340" text-anchor="middle" font-size="11" fill="#888888">压入 3</text>

  <!-- ============ Column 4 : i=0 v=1 ============ -->
  <text x="665" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3864">第 4 步</text>
  <text x="665" y="84" text-anchor="middle" font-size="13" fill="#555555">i=0, v=1</text>
  <rect x="637" y="218" width="56" height="32" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="665" y="234" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#1f3864">4</text>
  <rect x="637" y="182" width="56" height="32" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="665" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#1f3864">3</text>
  <rect x="637" y="146" width="56" height="32" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="665" y="162" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#1f3864">1</text>
  <text x="699" y="162" text-anchor="start" dominant-baseline="central" font-size="11" fill="#b85450">←栈顶</text>
  <rect x="607" y="270" width="116" height="32" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="665" y="286" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2e6b2e">map[1] = 3</text>
  <text x="665" y="324" text-anchor="middle" font-size="11" fill="#888888">栈顶 3 &gt; 1 → 3</text>
  <text x="665" y="340" text-anchor="middle" font-size="11" fill="#888888">压入 1</text>

  <!-- footer -->
  <text x="380" y="368" text-anchor="middle" font-size="12" fill="#555555">最终 map = {1:3, 3:4, 4:-1, 2:-1}，再用 nums1 中的元素去 map 取值即得答案</text>
</svg>
